[package]
name = "tm20-md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "A strict printable CommonMark/GFM subset with source diagnostics for thermal tape"
keywords = ["markdown", "commonmark", "thermal", "printer"]
categories = ["parser-implementations", "text-processing"]

[features]
default = ["math"]
# LaTeX math rasterized with RaTeX and its embedded KaTeX fonts. Without it,
# math nodes still parse and become a `markdown.unsupported` error at their
# source location; the integration tests assume it is on.
math = [
    "dep:ratex-parser",
    "dep:ratex-layout",
    "dep:ratex-render",
    "dep:ratex-types",
    "dep:ratex-font",
    "dep:ratex-font-loader",
    "dep:ab_glyph",
]

[dependencies]
comrak = { version = "0.54", default-features = false }
tm20-set = { workspace = true }
ratex-parser = { version = "0.1.14", optional = true }
ratex-layout = { version = "0.1.14", optional = true }
ratex-render = { version = "0.1.14", features = ["embed-fonts"], optional = true }
ratex-types = { version = "0.1.14", optional = true }
ratex-font = { version = "0.1.14", optional = true }
ratex-font-loader = { version = "0.1.14", features = ["embed-fonts"], optional = true }
ab_glyph = { version = "0.2", optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tm20 = { workspace = true }

[lints]
workspace = true
